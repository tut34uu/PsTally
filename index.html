<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PsTally — Operations Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebe3da;--card:#fff;--side:#f7f4f0;--ink:#161513;--mute:#8a847c;--line:#ece6df;--green:#2d5a43;--greenbg:#e8f1ea;--bar:#b9c9bc;--warn:#b5651d;--warnbg:#fdf8ee;--red:#c0392b;--blue:#4a4fd8;--sel:#e6e8e6;--amber:#fbe9b7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--card:#26231f;--side:#211e1b;--ink:#f2ede6;--mute:#9a9389;--line:#35312c;--greenbg:#23342a;--bar:#4b5c50;--warnbg:#2c261b;--sel:#34312c;--amber:#5a4716;--blue:#9ea2ff;--green:#6fb38a}}
:root[data-theme="dark"]{--bg:#1b1916;--card:#26231f;--side:#211e1b;--ink:#f2ede6;--mute:#9a9389;--line:#35312c;--greenbg:#23342a;--bar:#4b5c50;--warnbg:#2c261b;--sel:#34312c;--amber:#5a4716;--blue:#9ea2ff;--green:#6fb38a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,sans-serif;display:flex;overflow:hidden}
.side{width:224px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{display:flex;align-items:center;justify-content:center;padding:14px 12px 12px;font:500 14px 'JetBrains Mono',monospace}.logo img{display:block;width:190px;height:auto;max-height:118px;object-fit:contain;border-radius:10px}.logo i{display:none}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--green);display:block}
nav{flex:1;overflow:auto;padding:0 9px;border-top:1px solid var(--line)}
nav h6{font-size:10px;letter-spacing:.08em;color:var(--mute);font-weight:500;padding:18px 8px 6px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:12px;padding:8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer}
nav a:hover{background:var(--sel)}
nav a.on{background:var(--sel);font-weight:500}
nav a:before{content:"";width:14px;height:14px;border:1.5px solid var(--mute);border-radius:4px;flex:none}
nav b{margin-left:auto;background:var(--amber);font-size:10px;font-weight:600;border-radius:9px;padding:1px 6px}
.foot{padding:12px 9px;border-top:1px solid var(--line);color:var(--mute)}
.foot a{display:flex;gap:12px;padding:8px;font-size:13px;color:var(--mute)}
main{flex:1;overflow:auto;padding:16px 20px 80px}
.wrap{max-width:1290px;display:grid;grid-template-columns:minmax(0,944px) 320px;gap:16px 17px}
.head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:23px;font-weight:600;letter-spacing:-.02em}
.date{color:var(--mute);font-size:12.5px;margin-top:2px}
.tabs{background:var(--card);border-radius:8px;padding:4px;display:flex;gap:2px}
.tabs button{border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;cursor:pointer}
.tabs button.on{background:#161513;color:#fff;font-weight:500}
.card{background:var(--card);border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:10px;letter-spacing:.08em;color:var(--mute);font-weight:500;text-transform:uppercase}
.rev{padding:16px 22px 20px}
.rev .top{display:flex;justify-content:space-between}
.big{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.big small{color:var(--mute);font-size:13px}
.big span{font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1}
.dn{color:var(--red);font-size:11.5px;margin-top:8px}.dn em{font-style:normal;color:var(--mute);margin:0 14px 0 3px}
.mini{display:flex;gap:28px;text-align:right}
.mini .n{font-size:24px;font-weight:600;display:flex;align-items:baseline;justify-content:flex-end;gap:4px;margin-top:2px}
.mini .n small{font-size:12px;color:var(--mute);font-weight:400}
.mini p{font-size:10.5px;color:var(--mute)}.mini a{color:var(--warn)}
.pace{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;color:var(--mute);font-size:11.5px}.pace b{color:var(--blue);font-weight:600}
.row3{grid-column:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:14px 16px 12px}.stat .v{font-size:20px;font-weight:600;margin-top:8px}.stat small{font-size:11px;color:var(--mute);font-weight:400;margin-right:3px}
.attn{background:var(--warnbg);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:12px 16px 10px}
.attn .lbl{margin-bottom:6px}
.attn div{display:flex;justify-content:space-between;line-height:23px;font-size:13.5px}
.attn .lbl+div{color:var(--warn);font-size:14.5px;font-weight:500}
.attn a{color:var(--warn);font-size:11.5px;cursor:pointer}
.alert{color:var(--warn);font-size:10.5px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;padding:0 0 0 2px}
.alert:before{content:"●";font-size:8px;margin-right:8px}.alert a{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.flag .lbl{padding:19px 16px 14px}
.flag .it{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.flag .it b{font-weight:500;font-size:13px}.flag .it p,.flag .it span{font-size:11.5px}.flag .it p{color:var(--warn);margin-top:2px}.flag .it span{color:var(--mute)}
.chart{padding:16px 16px 12px}
.chart .t{display:flex;justify-content:space-between}.chart .t span:last-child{font-size:11px}
.bars{display:flex;gap:14px;align-items:flex-end;height:96px;margin:10px 0 8px}
.bars div{flex:1;background:var(--bar);position:relative;border-radius:1px}
.bars div:after{content:attr(data-v);position:absolute;top:-14px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--mute)}
.bars .today{background:var(--green);border-top:2px dashed var(--ink)}
.days{display:flex;gap:14px;font-size:10px;color:var(--mute);text-align:center}.days span{flex:1}
.days span:last-child{color:var(--ink);font-weight:600}
.side2{grid-column:2;grid-row:2/7;display:flex;flex-direction:column;gap:16px}
.bayh{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-bottom:-6px}.bayh b{color:var(--green);text-transform:none;letter-spacing:0;font-weight:500}
.bays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bay{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;height:82px;font-size:11.5px;color:var(--mute)}
.bay b{display:block;color:var(--ink);font-size:13px;font-weight:500;margin-bottom:6px}
.bay.on{background:var(--greenbg);border-color:transparent}
.bay.on b:before,.bay.un b:before{content:"●";font-size:8px;color:var(--green);margin-right:7px;vertical-align:1px}
.bay small{display:block;margin-top:4px;font-size:11px}
.bay.un{background:var(--warnbg);border-color:#ecd9b0}.bay.un b:before{color:#ddd}.bay.un i{float:right;font:600 8px Inter;letter-spacing:.08em;color:var(--warn)}.bay.un p{color:var(--warn)}
.bay.op b:before{content:"●";font-size:8px;color:#ddd;margin-right:7px;vertical-align:1px}
.shift .lbl{padding:17px 16px 14px}
.shift .it{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.shift b{font-weight:500;font-size:14px}.shift p{font-size:11px;color:var(--mute);margin-top:3px}
.shift .r{text-align:right}.shift .r b{font-weight:600;font-size:13.5px}.shift .r p{font-size:9.5px;letter-spacing:.08em}
.demo{position:fixed;left:50%;bottom:0;transform:translateX(-30%);background:var(--card);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.demo button{font:inherit;font-weight:500;padding:9px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.demo .p{background:var(--green);color:#fff;border-color:var(--green)}
.demo .x{border:0;color:var(--mute);padding:0 4px}
.chat{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;background:var(--green);border:0}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}.side2{grid-column:1;grid-row:auto}.row3,.attn,.flag,.chart,.rev,.alert{grid-column:1}}
@media(max-width:720px){.side{display:none}main{padding:24px 14px 90px}.row3{grid-template-columns:1fr}.demo{transform:translateX(-50%);width:94%;flex-wrap:wrap}.mini{gap:14px}.big span{font-size:34px}.head{flex-direction:column;gap:12px}}

nav a:before{display:none}nav a svg,.foot svg{width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a.on svg{stroke:var(--ink)}.foot a{align-items:center;cursor:pointer}
.bay{cursor:pointer;transition:transform .15s,box-shadow .15s}.bay:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bay:focus-visible,button:focus-visible,nav a:focus-visible,.attn a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bars div{cursor:default;transition:background .2s,height .4s}.bars div:hover{background:var(--green)}.bars div.sel{background:var(--green)}.bars .today{border-top:2px dashed var(--ink)}
.attn.ok{border-left-color:var(--green);background:var(--greenbg)}.attn.ok div{color:var(--green)!important}
.alert.ok{color:var(--green)}.alert a{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.attn a,.flag a{cursor:pointer}.attn a:hover,.flag a:hover{text-decoration:underline}
.flag .it a{font-size:11.5px;color:var(--warn);margin-left:14px}.flag .it .rt{display:flex;align-items:center}
.flag .empty{padding:18px 16px;color:var(--mute);border-top:1px solid var(--line)}
.mask{position:fixed;inset:0;background:rgba(20,16,12,.35);display:none;align-items:center;justify-content:center;z-index:9}.mask.show{display:flex}
.dlg{background:var(--card);border-radius:12px;padding:20px;width:min(340px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dlg h3{font-size:15px;margin-bottom:2px}.dlg p{color:var(--mute);font-size:12px;margin-bottom:14px}
.dlg button{display:block;width:100%;text-align:left;font:inherit;padding:10px 12px;margin-top:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.dlg button:hover{background:var(--greenbg)}.dlg .end{color:var(--red)}.dlg .cx{border:0;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:#161513;color:#fff;padding:10px 16px;border-radius:8px;transition:transform .25s;z-index:10;font-size:12.5px}.toast.show{transform:translate(-50%,0)}
.tick{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.tick{animation:none}.toast,.bars div{transition:none}}
.dn.up{color:var(--green)}
[hidden]{display:none!important}
.pg{max-width:1100px}.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}.ph p{color:var(--mute);font-size:12.5px;margin-top:2px}
.pg table{width:100%;border-collapse:collapse}.pg th{text-align:left;font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;padding:14px 16px;font-weight:500}.pg td{padding:12px 16px;border-top:1px solid var(--line)}.tw{overflow-x:auto}
.pill{font-size:11px;padding:2px 9px;border-radius:9px;background:var(--sel)}.pill.g{background:var(--greenbg);color:var(--green)}.pill.w{background:var(--amber)}.pill.r{color:var(--red)}
.btn{font:inherit;font-weight:500;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}.lk{font:inherit;font-size:12px;border:0;background:none;color:var(--green);cursor:pointer;margin-right:12px;padding:0}.lk.x{color:var(--mute)}
.sum{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12.5px}.sum b{color:var(--ink);font-size:15px;margin-left:6px}
.empty2{padding:28px 16px;color:var(--mute);text-align:center}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.menu{display:none;margin-bottom:12px}.cfg{padding:20px;max-width:420px}.cfg label,.dlg label{display:block;font-size:11.5px;color:var(--mute);margin-top:10px}.cfg input,.dlg input,.dlg select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}.payinfo{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--greenbg);margin-top:12px}.payinfo .row{display:flex;justify-content:space-between;gap:14px;padding:5px 0}.payinfo .row span{color:var(--mute)}.payinfo b{font-weight:700;color:var(--green)}
.dlg .pri{background:var(--green);color:#fff;text-align:center;margin-top:14px;border-color:var(--green)}
@media(max-width:720px){.side{display:flex;position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:8}.side.open{transform:none}.menu{display:inline-block}}


.hero-logo{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-start;height:48px;padding:0;margin:0 0 2px;border:0;background:transparent;border-radius:0;overflow:visible}
.hero-logo img{width:auto;height:40px;max-width:180px;object-fit:contain;display:block;border-radius:6px}
@media(max-width:720px){.hero-logo{height:40px}}

.quickbar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}.quickbar button{font:inherit;font-weight:600;padding:9px 13px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.quickbar .primary{background:var(--green);color:#fff;border-color:var(--green)}
.bay{height:auto;min-height:106px;position:relative}.bay .bill{font-weight:600;color:var(--ink);margin-top:5px}.bay .actions{display:flex;gap:5px;margin-top:7px}.bay .actions button{font:inherit;font-size:10px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);cursor:pointer}.bay .actions button:first-child{background:var(--green);color:#fff;border-color:var(--green)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.metric{padding:13px 15px}.metric .v{font-size:19px;font-weight:600;margin-top:5px}.metric p{font-size:10.5px;color:var(--mute);margin-top:2px}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.quickbar{display:grid;grid-template-columns:1fr 1fr}}
.dlg .choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.dlg .choice button{margin:0}.session-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.session-meta div{padding:9px;background:var(--bg);border-radius:7px}.session-meta span{display:block;font-size:10px;color:var(--mute)}.session-meta b{font-size:14px}
</style>
